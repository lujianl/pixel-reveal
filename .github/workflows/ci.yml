name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the published entry points exist
        run: |
          test -f dist/pixel-reveal.js
          test -f dist/pixel-reveal.cjs
          test -f dist/pixel-reveal.iife.js
          test -f dist/types/index.d.ts
          test -f dist-demo/index.html

      - name: Formatting
        run: npm run format:check
